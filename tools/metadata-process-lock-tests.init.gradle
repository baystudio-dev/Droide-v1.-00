// Cooperative metadata OS-lock tests, plus F115 rollback-evidence and custody controls.
// Host-only, existing JNI fixture, no native compilation.
apply from: new File(gradle.startParameter.currentDir, 'tools/sqlite-rollback-evidence-tests.init.gradle')
gradle.projectsEvaluated {
    def app = gradle.rootProject.project(':app')
    app.tasks.named('compileDebugKotlin').configure {
        source(app.fileTree('src/main/java/com/baystudio/droide/core') { include('MirrorMetadataProcessLock.kt') })
    }
    app.tasks.named('compileDebugUnitTestKotlin').configure {
        source(app.fileTree('src/test/java/com/baystudio/droide/core') {
            include('MirrorMetadataProcessLockTest.kt', 'MirrorMetadataProcessLockAuthorityTest.kt')
        })
    }
}

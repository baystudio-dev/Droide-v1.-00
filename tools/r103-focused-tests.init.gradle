// Focused host test compilation only. Production source/tasks and their checks remain intact.
// The unfiltered R102 test tree has unrelated API drift; keep its failed log, not a false green.
allprojects {
    tasks.withType(org.gradle.api.tasks.testing.Test).configureEach {
        executable = '/usr/bin/java'
        systemProperty 'robolectric.offline', 'true'
        systemProperty 'robolectric.dependency.dir', System.getProperty('droide.robolectric.dir')
    }
}
gradle.projectsEvaluated {
    def app = gradle.rootProject.project(':app')
    def selected = [
        'LspRProfileTest.kt', 'LspRIntegrationTest.kt', 'LspClojureIntegrationTest.kt', 'CMakeDirectorySyncTest.kt',
        'AgentPromptPromotionTransactionTest.kt', 'AgentRunFailureBoundaryTest.kt',
        'AgentIntentWorkflowTest.kt', 'AgentWorkflowFixtures.kt', 'ProviderStreamErrorTransportTest.kt',
        'ProviderLoopbackServer.kt', 'SearchCaptureFixtures.kt'
    ]
    app.tasks.named('compileDebugUnitTestKotlin').configure {
        setSource(app.fileTree('src/test/java/com/baystudio/droide/core') {
            include(selected)
        })
    }

}

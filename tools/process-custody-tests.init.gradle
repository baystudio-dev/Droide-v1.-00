// F113 durable custody and recovery integration, including the F111/F112 controls.
// Uses an explicitly supplied host JNI fixture; never builds native code.
apply from: new File(gradle.startParameter.currentDir, 'tools/editor-recovery-writer-tests.init.gradle')
gradle.projectsEvaluated {
    def app = gradle.rootProject.project(':app')
    app.tasks.named('testDebugUnitTest').configure {
        doFirst { systemProperty 'droide.custody.test.classpath', classpath.asPath }
    }
    app.tasks.named('compileDebugUnitTestKotlin').configure {
        source(app.fileTree('src/test/java/com/baystudio/droide/core') {
            include('MirrorProcessCustodyTest.kt', 'MirrorMetadataAuthorityTest.kt',
                'MirrorProcessCustodyRestartTest.kt', 'MirrorProcessCustodyRestartFixture.kt')
        })
    }
}

Description: |-
  Edit projects, use Git and an interactive Linux terminal, run development tools,
  and configure optional AI agents on Android. The Ubuntu environment is installed
  on demand after consent and reused. Editing is available without installation.
  Ubuntu requires ARM64. Optional tools and providers retain their own terms.


// Explicit raw rollback-evidence capture plus previous custody/boot controls.
// Host only; uses the supplied JNI fixture and never builds native Android code.
apply from: new File(gradle.startParameter.currentDir, 'tools/process-boot-tests.init.gradle')
gradle.projectsEvaluated {
    def app = gradle.rootProject.project(':app')
    app.tasks.named('compileDebugKotlin').configure {
        source(app.fileTree('src/main/java/com/baystudio/droide/core') {
            include('MirrorSqliteRollbackRecovery.kt', 'MirrorProcessCleanupReceipts.kt')
        })
    }
    app.tasks.named('compileDebugUnitTestKotlin').configure {
        source(app.fileTree('src/test/java/com/baystudio/droide/core') {
            include('MirrorSqliteRollbackRecoveryTest.kt', 'MirrorSqliteRollbackAuthorityTest.kt')
        })
    }
}

name: Bug report
description: Report a reproducible application problem.
body:
  - type: input
    id: version
    attributes:
      label: Application version
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device model and Android version
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and observed behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Relevant logs or example project
      description: Remove credentials, private code, and personal information before attaching files.

name: F-Droid isolated source proofs

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fdroid-source-proofs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  registry-parity:
    name: Official registry byte parity (data only)
    runs-on: ubuntu-24.04
    timeout-minutes: 11
    steps:
      - name: Checkout source without stored credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Compare only the eight fixed official artifact endpoints
        run: |
          /usr/bin/timeout --signal=TERM --kill-after=5s 540s \
            /usr/bin/python3 -I -B tools/fdroid_maven_registry_parity.py \
              --download-and-compare \
              --output-dir "$RUNNER_TEMP/droide-registry-parity-proof"
      # Opaque, non-executable comparison data only: no extraction, compilation,
      # dependency substitution, artifact publication, or application execution.

  sandbox-readiness:
    name: Sandbox readiness (no compilation)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout source without stored credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Provision trusted OS sandbox utility
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes bubblewrap
      - name: Read only non-secret namespace setup metadata
        run: |
          python3 -I -B - <<'PY'
          import json
          from pathlib import Path
          import subprocess
          fields = {"Uid", "Gid", "Groups", "CapInh", "CapPrm", "CapEff", "CapBnd", "CapAmb", "NoNewPrivs", "Seccomp"}
          status = {}
          for line in Path("/proc/self/status").read_text().splitlines():
              key, _, value = line.partition(":")
              if key in fields:
                  status[key] = value.strip()
          print(json.dumps({"setupProcessStatus": status}, sort_keys=True))
          for name in ("/proc/self/attr/current", "/proc/sys/kernel/apparmor_restrict_unprivileged_userns",
                       "/proc/sys/kernel/unprivileged_userns_clone", "/proc/sys/user/max_user_namespaces",
                       "/etc/apparmor.d/bwrap"):
              try:
                  with Path(name).open("r") as stream:
                      value = stream.read(4097)
                  print(json.dumps({"path": name, "value": value[:4096], "truncated": len(value) > 4096}))
              except (FileNotFoundError, PermissionError) as error:
                  print(json.dumps({"path": name, "unavailable": type(error).__name__}))
          for command in (("/usr/bin/bwrap", "--version"), ("/usr/bin/unshare", "--version")):
              result = subprocess.run(command, check=True, capture_output=True, text=True, timeout=5)
              print(json.dumps({"tool": command[0], "version": result.stdout.strip()}))
          PY
      - name: Require isolated source contracts before provisioning compilers
        run: bash tools/run_fdroid_source_proofs.sh tests --sudo

  source-proof:
    name: source-proof (${{ matrix.proof }})
    needs: sandbox-readiness
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        proof: [tests, cli, loaders, proot, spake2, termux, view]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout source without stored credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Provision trusted OS sandbox utility
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes bubblewrap
      - name: Provision and verify the existing pinned vendor JDK
        if: matrix.proof == 'spake2' || matrix.proof == 'termux' || matrix.proof == 'view'
        run: python3 -B tools/provision_build_jdk.py --output "$RUNNER_TEMP/source-proof-jdk"
      - name: Set up Android tools for trusted SDK provisioning
        if: matrix.proof == 'cli' || matrix.proof == 'loaders' || matrix.proof == 'proot' || matrix.proof == 'termux' || matrix.proof == 'view'
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: 'false'
      - name: Provision the existing pinned NDK
        if: matrix.proof == 'cli' || matrix.proof == 'proot'
        run: sdkmanager --install 'ndk;28.2.13676358'
      - name: Provision the historical loader NDK and recipe utility
        if: matrix.proof == 'loaders' || matrix.proof == 'proot'
        run: |
          sdkmanager --install 'ndk;29.0.14206865'
          sudo apt-get install --no-install-recommends --yes gawk
          # Trusted provisioning precedes the empty-environment offline sandbox.
          # The proof records installed identities; it does not claim that
          # source.properties alone authenticates the historical NDK ZIP.
      - name: Provision engine patch and source-wrapper utilities
        if: matrix.proof == 'proot'
        run: sudo apt-get install --no-install-recommends --yes patch xxd
      - name: Provision API 36 (the proof checks the exact android.jar hash)
        if: matrix.proof == 'termux' || matrix.proof == 'view'
        run: sdkmanager --install 'platforms;android-36'
      - name: Provision only the existing pinned annotation compiler dependency
        if: matrix.proof == 'view'
        run: |
          set -euo pipefail
          # This public compiler input must be readable by sandbox UID 65534;
          # the sandbox bind is read-only and no credentials are stored here.
          umask 022
          annotation_input="$RUNNER_TEMP/source-proof-annotation-jvm-1.10.0.jar"
          test ! -e "$annotation_input"
          test ! -L "$annotation_input"
          /usr/bin/timeout --signal=TERM --kill-after=5s 90s \
            /usr/bin/curl --disable --fail --silent --show-error --proto '=https' \
              --max-time 60 --max-filesize 1048576 \
              --output "$annotation_input" \
              'https://dl.google.com/dl/android/maven2/androidx/annotation/annotation-jvm/1.10.0/annotation-jvm-1.10.0.jar'
          printf '%s  %s\n' \
            'ddd072ddbb553178e205517ce777b2f05aa9e412982d9ecb4eedc74f1212f697' \
            "$annotation_input" | /usr/bin/sha256sum --check --strict -
          # Fixed pinned opaque download only. No redirects, extraction,
          # execution, Kotlin addition, or production dependency change here.
      - name: Run source proof contract tests offline
        if: matrix.proof == 'tests'
        run: bash tools/run_fdroid_source_proofs.sh tests --sudo
      - name: Compile and inspect CLI twice offline (never execute ARM64 output)
        if: matrix.proof == 'cli'
        run: bash tools/run_fdroid_source_proofs.sh cli --sudo --ndk "$ANDROID_HOME/ndk/28.2.13676358"
      - name: Rebuild and compare both PRoot loaders twice offline (never execute outputs)
        if: matrix.proof == 'loaders'
        run: bash tools/run_fdroid_source_proofs.sh loaders --sudo --ndk "$ANDROID_HOME/ndk/29.0.14206865"
      - name: Rebuild patched PRoot with both source-built loaders twice offline
        if: matrix.proof == 'proot'
        run: |
          bash tools/run_fdroid_source_proofs.sh proot --sudo \
            --ndk "$ANDROID_HOME/ndk/28.2.13676358" \
            --loader-ndk "$ANDROID_HOME/ndk/29.0.14206865"
      - name: Compile SPAKE2 twice and check retained deterministic vector offline
        if: matrix.proof == 'spake2'
        run: |
          bash tools/run_fdroid_source_proofs.sh spake2 --sudo \
            --jdk "$RUNNER_TEMP/source-proof-jdk/jdk-17.0.20.1+1" \
            --jdk-archive "$RUNNER_TEMP/source-proof-jdk/vendor.tar.gz"
      - name: Compile complete Termux emulator Java twice offline
        if: matrix.proof == 'termux'
        run: |
          bash tools/run_fdroid_source_proofs.sh termux --sudo \
            --jdk "$RUNNER_TEMP/source-proof-jdk/jdk-17.0.20.1+1" \
            --jdk-archive "$RUNNER_TEMP/source-proof-jdk/vendor.tar.gz" \
            --android-jar "$ANDROID_HOME/platforms/android-36/android.jar"
      - name: Compile complete Terminal View twice against a source-built emulator offline
        if: matrix.proof == 'view'
        run: |
          bash tools/run_fdroid_source_proofs.sh view --sudo \
            --jdk "$RUNNER_TEMP/source-proof-jdk/jdk-17.0.20.1+1" \
            --jdk-archive "$RUNNER_TEMP/source-proof-jdk/vendor.tar.gz" \
            --android-jar "$ANDROID_HOME/platforms/android-36/android.jar" \
            --annotation-jar "$RUNNER_TEMP/source-proof-annotation-jvm-1.10.0.jar"
      # No APK, compiled replacement JAR/ELF, signing credentials, or artifact
      # publication belongs in this workflow. Scratch outputs disappear when
      # the sandbox exits. Success is not F-Droid or Android-device acceptance.

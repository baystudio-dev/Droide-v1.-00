name: Upload verified release assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
        type: string
      commit:
        description: Expected full source commit SHA
        required: true
        type: string
      assets:
        description: JSON manifest with filenames, sizes, SHA-256 hashes, and download URLs or base64 content
        required: true
        type: string

permissions: {}

concurrency:
  group: release-assets-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify and upload to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: ${{ inputs.commit }}
          RELEASE_ASSETS: ${{ inputs.assets }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -B .github/scripts/upload_release_assets.py

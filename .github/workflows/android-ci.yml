name: F-Droid source build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fdroid-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17.0.20+101'
          check-latest: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'

      - name: Install pinned build inputs
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;28.2.13676358"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '8.13'
          cache-disabled: true

      - name: Verify source inputs
        run: python3 -B tools/verify_fdroid_inputs.py --root "$PWD"

      - name: Compile release and run release checks
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/build_fdroid_candidate.py \
            --sdk "$ANDROID_HOME" --java-home "$JAVA_HOME" \
            --gradle "$(command -v gradle)" \
            --dependencies "$RUNNER_TEMP/droide-source-products" 2>&1 | tee fdroid-build.log
          sha256sum app/build-source-release-fdroid-candidate/outputs/apk/release/*.apk > fdroid-apk-sha256.txt

      - name: Upload verification and unsigned APK
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: droide-fdroid-source-release
          path: |
            app/build-source-release-fdroid-candidate/outputs/apk/release/*.apk
            app/build-source-release-fdroid-candidate/outputs/source-release-verification.json
            app/build-source-release-fdroid-candidate/reports/lint-results-release.*
            fdroid-build.log
            fdroid-apk-sha256.txt
          if-no-files-found: warn
          retention-days: 14
